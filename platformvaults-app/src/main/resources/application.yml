server:
  port: 8080

spring:
  application:
    name: platformvaults

  datasource:
    url: jdbc:postgresql://localhost:5432/platformvaults
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  telegram:
    bot:
      token: ${TELEGRAM_BOT_TOKEN:your-bot-token-here}
      username: ${TELEGRAM_BOT_USERNAME:your_bot_username}
      name: ${TELEGRAM_BOT_NAME:PlatformVaultsBot}

logging:
  level:
    com.platformvaults: DEBUG
    org.springframework.web: INFO
    org.hibernate: INFO
